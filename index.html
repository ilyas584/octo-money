<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Dompetku</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#0f1d1a;--mu:#64748b;--pr:#0f766e;--prt:#fff;--in:#15803d;--out:#dc2626;--bd:#e2e8f0;--soft:#eef2f1;--warn:#fef3c7;--warnt:#92400e}
@media(prefers-color-scheme:dark){:root{--bg:#0b1210;--card:#131d1a;--tx:#e8f0ed;--mu:#94a3a0;--pr:#2dd4bf;--prt:#042f2a;--in:#4ade80;--out:#f87171;--bd:#23302c;--soft:#1a2622;--warn:#3a2f0b;--warnt:#fcd34d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:96px}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px 8px}
h1{font-size:22px;margin:0}
h3{margin:0 0 12px;font-size:18px}
main{padding:0 16px}
.ico{background:var(--card);border:1px solid var(--bd);border-radius:12px;width:40px;height:40px;font-size:18px;color:var(--tx)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:var(--pr);color:var(--prt);border:0}
.hero .lbl{opacity:.85;font-size:13px}
.hero .big{font-size:32px;font-weight:700;margin:4px 0 6px;letter-spacing:-.5px}
.hero .sub{font-size:13px;opacity:.9;display:flex;gap:14px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid3{grid-template-columns:1fr 1fr 1fr}
.mini{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px}
.mini .lbl{font-size:12px;color:var(--mu)}
.mini .val{font-size:15px;font-weight:650;margin-top:2px;word-break:break-word}
.in{color:var(--in)}.out{color:var(--out)}.muted{color:var(--mu);font-size:13px;margin:0 0 10px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px}
.sec b{font-size:15px}.sec a{color:var(--pr);font-size:13px;font-weight:600;background:none;border:0;padding:4px}
.row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--bd);cursor:pointer}
.row:last-child{border-bottom:0}
.row .ic{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:none}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-weight:650;white-space:nowrap}
.day{font-size:12px;color:var(--mu);margin:14px 2px 2px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in-nav{display:flex;width:100%;max-width:560px}
nav button{flex:1;background:none;border:0;padding:8px 0 10px;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{color:var(--pr);font-weight:700}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(72px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;background:var(--pr);color:var(--prt);font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
.btn{width:100%;border:0;border-radius:14px;background:var(--pr);color:var(--prt);padding:14px;font-size:16px;font-weight:650;margin-top:14px}
.btn.sec2{background:var(--soft);color:var(--tx)}
.btn.danger{background:transparent;color:var(--out);border:1px solid var(--out)}
.sm{border:0;border-radius:10px;padding:8px 12px;font-weight:600;background:var(--soft);color:var(--tx);font-size:13px}
.sm.pri{background:var(--pr);color:var(--prt)}.sm.del{color:var(--out)}
.acts{display:flex;gap:8px;margin-top:10px}
label{display:block;font-size:12px;color:var(--mu);margin:12px 0 4px;font-weight:600}
input,select{width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:12px;font-size:16px}
input.big{font-size:26px;font-weight:700;padding:12px}
input[type=checkbox]{width:20px;height:20px;padding:0}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:14px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:650;color:var(--mu);font-size:14px}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on.in{color:var(--in)}.seg button.on.out{color:var(--out)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 12px;font-size:13px}
.chip.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.fl{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.fl input[type=month]{flex:1}
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.on{display:block}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sh{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.bcol{text-align:center;font-size:11px;color:var(--mu)}
.bpair{height:90px;display:flex;align-items:flex-end;justify-content:center;gap:3px;margin-bottom:4px}
.bpair i{display:block;width:12px;border-radius:4px 4px 0 0;min-height:2px}
.bi{background:var(--in)}.bo{background:var(--out)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:8px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.prog{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--pr);border-radius:99px}
.prog.o i{background:var(--out)}
.catr{margin:8px 0}.catr .h{display:flex;justify-content:space-between;font-size:13px}
.warn{background:var(--warn);color:var(--warnt);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft)}
.badge.h{color:var(--out)}.badge.p{color:var(--in)}
.empty{text-align:center;color:var(--mu);padding:28px 10px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.kv:last-of-type{border-bottom:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="imp" accept="application/json,.json" hidden>
<script>
'use strict';
/* ====== Util ====== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const ym=s=>s.slice(0,7);
const MONTHS=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const fmtDate=s=>{const p=s.split('-');return +p[2]+' '+MONTHS[+p[1]-1]+' '+p[0]};
const fmtYM=s=>{const p=s.split('-');return MONTHS[+p[1]-1]+' '+p[0]};
const parseAmt=s=>parseInt(String(s).replace(/\D/g,''),10)||0;
function fmtInput(el){const v=el.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'').slice(0,15);el.value=v?(+v).toLocaleString('id-ID'):''}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}

/* ====== Data ====== */
const KEY='dompetku.v1';
const SIGN={income:1,expense:-1,save:-1,withdraw:1,borrow:1,debt_pay:-1,lend:-1,loan_receive:1};
const TL={income:'Pemasukan',expense:'Pengeluaran',save:'Setor tabungan',withdraw:'Tarik tabungan',borrow:'Pinjaman diterima',debt_pay:'Bayar hutang',lend:'Uang dipinjamkan',loan_receive:'Piutang diterima'};
const TI={income:'💰',expense:'🛒',save:'🐷',withdraw:'🏧',borrow:'🤲',debt_pay:'💸',lend:'🤝',loan_receive:'✅'};
const CAT_OUT=['Makan','Transport','Belanja','Tagihan','Hiburan','Kesehatan','Pendidikan','Lainnya'];
const CAT_IN=['Gaji','Bonus','Usaha','Hadiah','Saldo awal','Lainnya'];
let storageOK=true;
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);return {tx:d.tx||[],goals:d.goals||[],debts:d.debts||[],lastBackup:d.lastBackup||''}}}
  catch(e){storageOK=false}
  return {tx:[],goals:[],debts:[],lastBackup:''};
}
let S=load();
function save(){
  if(!storageOK){toast('Penyimpanan diblokir browser. Data tidak tersimpan!');return}
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Gagal menyimpan data!')}
}
function calc(){
  let cash=0;for(const t of S.tx)cash+=(SIGN[t.type]||0)*t.amount;
  const goals=S.goals.map(g=>({...g,bal:S.tx.filter(t=>t.goalId===g.id).reduce((a,t)=>a+(t.type==='save'?t.amount:t.type==='withdraw'?-t.amount:0),0)}));
  const saving=goals.reduce((a,g)=>a+g.bal,0);
  const debts=S.debts.map(d=>{const paid=S.tx.filter(t=>t.debtId===d.id&&(t.type==='debt_pay'||t.type==='loan_receive')).reduce((a,t)=>a+t.amount,0);return {...d,paid,rem:Math.max(0,d.principal-paid)}});
  const hutang=debts.filter(d=>d.type==='hutang').reduce((a,d)=>a+d.rem,0);
  const piutang=debts.filter(d=>d.type==='piutang').reduce((a,d)=>a+d.rem,0);
  return {cash,goals,saving,debts,hutang,piutang,total:cash+saving,net:cash+saving+piutang-hutang};
}
const cmp=(a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0);
function txMeta(t){
  let title;
  if(t.type==='income'||t.type==='expense')title=t.category||TL[t.type];
  else if(t.goalId){const g=S.goals.find(x=>x.id===t.goalId);title=TL[t.type]+' · '+(g?g.name:'(dihapus)')}
  else if(t.debtId){const d=S.debts.find(x=>x.id===t.debtId);title=TL[t.type]+' · '+(d?d.person:'(dihapus)')}
  else title=TL[t.type]||t.type;
  return {icon:TI[t.type]||'•',title,sub:fmtDate(t.date)+(t.note?' · '+t.note:'')};
}
function txRow(t){
  const m=txMeta(t),s=SIGN[t.type]||0;
  return `<div class="row" onclick="openTxDetail('${t.id}')"><div class="ic">${m.icon}</div><div class="mid"><div class="t">${esc(m.title)}</div><div class="s">${esc(m.sub)}</div></div><div class="a ${s>0?'in':'out'}">${s>0?'+':'-'}${rp(t.amount).replace('-','')}</div></div>`;
}
function commit(msg){save();closeSheet();render();if(msg)toast(msg)}

/* ====== Sheet ====== */
function sheet(h){const s=$('#sheet');s.innerHTML='<div class="ov" onclick="closeSheet()"></div><div class="sh">'+h+'</div>';s.classList.add('on')}
function closeSheet(){const s=$('#sheet');s.classList.remove('on');s.innerHTML=''}

/* ====== Navigation ====== */
let V='home';
const TITLES={home:'Dompetku',mutasi:'Mutasi',tab:'Tabungan',hutang:'Hutang & Piutang'};
function go(v){V=v;window.scrollTo(0,0);render()}
function render(){
  const y=window.scrollY,c=calc();
  const body=V==='home'?viewHome(c):V==='mutasi'?viewMutasi():V==='tab'?viewTab(c):viewHutang(c);
  const nb=(k,i,l)=>`<button class="${V===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`;
  $('#app').innerHTML=`<header><h1>${TITLES[V]}</h1><button class="ico" onclick="openSettings()" aria-label="Pengaturan">⚙️</button></header><main>${body}</main>
  <nav><div class="in-nav">${nb('home','🏠','Beranda')}${nb('mutasi','📒','Mutasi')}${nb('tab','🐷','Tabungan')}${nb('hutang','🤝','Hutang')}</div></nav>
  ${(V==='home'||V==='mutasi')?'<button class="fab" onclick="openTx()" aria-label="Catat transaksi">+</button>':''}`;
  if(V==='mutasi')renderList();
  window.scrollTo(0,y);
}

/* ====== Beranda ====== */
function viewHome(c){
  const cm=ym(today());
  const inc=S.tx.filter(t=>t.type==='income'&&ym(t.date)===cm).reduce((a,t)=>a+t.amount,0);
  const exp=S.tx.filter(t=>t.type==='expense'&&ym(t.date)===cm).reduce((a,t)=>a+t.amount,0);
  // 6 bulan terakhir
  const ms=[];const d=new Date();d.setDate(1);
  for(let i=5;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);ms.push(x.getFullYear()+'-'+pad(x.getMonth()+1))}
  const data=ms.map(m=>({m,inc:S.tx.filter(t=>t.type==='income'&&ym(t.date)===m).reduce((a,t)=>a+t.amount,0),exp:S.tx.filter(t=>t.type==='expense'&&ym(t.date)===m).reduce((a,t)=>a+t.amount,0)}));
  const mx=Math.max(1,...data.map(x=>Math.max(x.inc,x.exp)));
  const h=v=>Math.round(v/mx*100);
  // kategori bulan ini
  const cats={};S.tx.filter(t=>t.type==='expense'&&ym(t.date)===cm).forEach(t=>cats[t.category||'Lainnya']=(cats[t.category||'Lainnya']||0)+t.amount);
  const top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const recent=[...S.tx].sort(cmp).slice(0,5);
  const stale=S.tx.length>=5&&(!S.lastBackup||(Date.now()-new Date(S.lastBackup).getTime())>14*864e5);
  return `
  ${!storageOK?'<div class="warn">Browser memblokir penyimpanan. Data tidak akan tersimpan. Buka lewat Chrome biasa (bukan mode samaran).</div>':''}
  ${c.cash<0?'<div class="warn">Saldo kas negatif. Kemungkinan saldo awal belum dicatat.</div>':''}
  ${stale?'<div class="warn">Data hanya ada di perangkat ini dan belum dicadangkan 14 hari terakhir. Buka ⚙️ lalu Ekspor cadangan.</div>':''}
  <div class="card hero"><div class="lbl">Total saldo (kas + tabungan)</div><div class="big">${rp(c.total)}</div>
    <div class="sub"><span>Kas ${rp(c.cash)}</span><span>Tabungan ${rp(c.saving)}</span></div></div>
  <div class="grid grid3">
    <div class="mini"><div class="lbl">Hutang saya</div><div class="val out">${rp(c.hutang)}</div></div>
    <div class="mini"><div class="lbl">Piutang</div><div class="val in">${rp(c.piutang)}</div></div>
    <div class="mini"><div class="lbl">Kekayaan bersih</div><div class="val ${c.net<0?'out':''}">${rp(c.net)}</div></div>
  </div>
  ${S.tx.length===0?`<div class="card"><b>Mulai dari saldo awal</b><p class="muted" style="margin-top:6px">Catat uang yang kamu pegang sekarang sebagai pemasukan "Saldo awal", supaya total saldo sesuai kenyataan.</p><button class="btn" style="margin-top:0" onclick="openOpening()">Catat saldo awal</button></div>`:''}
  <div class="grid"><div class="mini"><div class="lbl">Pemasukan ${fmtYM(cm)}</div><div class="val in">${rp(inc)}</div></div><div class="mini"><div class="lbl">Pengeluaran ${fmtYM(cm)}</div><div class="val out">${rp(exp)}</div></div></div>
  <div class="card"><b>6 bulan terakhir</b><div class="bars" style="margin-top:10px">${data.map(x=>`<div class="bcol"><div class="bpair"><i class="bi" style="height:${h(x.inc)}%"></i><i class="bo" style="height:${h(x.exp)}%"></i></div>${MONTHS[+x.m.slice(5)-1]}</div>`).join('')}</div>
  <div class="legend"><span><b style="background:var(--in)"></b>Pemasukan</span><span><b style="background:var(--out)"></b>Pengeluaran</span></div></div>
  ${top.length?`<div class="card"><b>Pengeluaran terbesar bulan ini</b>${top.map(([k,v])=>`<div class="catr"><div class="h"><span>${esc(k)}</span><span>${rp(v)}</span></div><div class="prog o"><i style="width:${Math.round(v/exp*100)}%"></i></div></div>`).join('')}</div>`:''}
  <div class="sec"><b>Transaksi terakhir</b><a onclick="go('mutasi')">Lihat semua</a></div>
  <div class="card" style="padding:4px 12px">${recent.length?recent.map(txRow).join(''):'<div class="empty">Belum ada transaksi</div>'}</div>`;
}

/* ====== Mutasi ====== */
let M={month:ym(today()),kind:'all',q:''};
function filtered(){
  const q=M.q.trim().toLowerCase();
  return S.tx.filter(t=>(!M.month||ym(t.date)===M.month)&&(M.kind==='all'||(M.kind==='in'?SIGN[t.type]>0:SIGN[t.type]<0))&&(!q||(txMeta(t).title+' '+(t.note||'')).toLowerCase().includes(q))).sort(cmp);
}
function viewMutasi(){
  const k=(v,l)=>`<button class="chip ${M.kind===v?'on':''}" onclick="M.kind='${v}';render()">${l}</button>`;
  return `<div class="fl"><input type="month" value="${M.month}" onchange="M.month=this.value;render()"><button class="sm" onclick="M.month='';render()">Semua</button></div>
  <div class="chips" style="margin-bottom:10px">${k('all','Semua')}${k('in','Uang masuk')}${k('out','Uang keluar')}</div>
  <input placeholder="Cari kategori / catatan" value="${esc(M.q)}" oninput="M.q=this.value;renderList()" style="margin-bottom:12px">
  <div id="msum"></div><div id="mlist"></div>`;
}
function renderList(){
  const l=filtered();
  const i=l.filter(t=>SIGN[t.type]>0).reduce((a,t)=>a+t.amount,0),o=l.filter(t=>SIGN[t.type]<0).reduce((a,t)=>a+t.amount,0);
  $('#msum').innerHTML=`<div class="grid grid3"><div class="mini"><div class="lbl">Masuk</div><div class="val in">${rp(i)}</div></div><div class="mini"><div class="lbl">Keluar</div><div class="val out">${rp(o)}</div></div><div class="mini"><div class="lbl">Selisih</div><div class="val ${i-o<0?'out':'in'}">${rp(i-o)}</div></div></div>`;
  if(!l.length){$('#mlist').innerHTML='<div class="empty">Tidak ada transaksi</div>';return}
  let h='',last='';
  for(const t of l){if(t.date!==last){if(last)h+='</div>';h+=`<div class="day">${fmtDate(t.date)}</div><div class="card" style="padding:2px 12px;margin-bottom:6px">`;last=t.date}h+=txRow(t)}
  $('#mlist').innerHTML=h+'</div>';
}

/* ====== Form transaksi ====== */
let F={};
function readTxDom(){if($('#f-amt')){F.amount=$('#f-amt').value;F.date=$('#f-date').value||today();F.note=$('#f-note').value}}
function openTx(id,ty){
  const t=id?S.tx.find(x=>x.id===id):null;
  F={id:t?t.id:null,type:t?t.type:(ty||'expense'),cat:t?(t.category||''):'',amount:t?t.amount.toLocaleString('id-ID'):'',date:t?t.date:today(),note:t?(t.note||''):''};
  renderTxForm();if(!t)setTimeout(()=>{const e=$('#f-amt');if(e)e.focus()},50);
}
function openOpening(){openTx(null,'income');F.cat='Saldo awal';renderTxForm()}
function setTxType(ty){readTxDom();F.type=ty;F.cat='';renderTxForm()}
function pickCat(c){readTxDom();F.cat=c;renderTxForm()}
function renderTxForm(){
  const cats=F.type==='income'?CAT_IN:CAT_OUT;
  if(!F.cat)F.cat=cats[0];
  sheet(`<h3>${F.id?'Ubah':'Catat'} transaksi</h3>
  <div class="seg"><button class="${F.type==='expense'?'on out':''}" onclick="setTxType('expense')">Pengeluaran</button><button class="${F.type==='income'?'on in':''}" onclick="setTxType('income')">Pemasukan</button></div>
  <label>Jumlah (Rp)</label><input id="f-amt" class="big" inputmode="numeric" placeholder="0" value="${esc(F.amount)}" oninput="fmtInput(this)">
  <label>Kategori</label><div class="chips">${cats.map(c=>`<button class="chip ${c===F.cat?'on':''}" onclick="pickCat('${c}')">${c}</button>`).join('')}</div>
  <label>Tanggal</label><input id="f-date" type="date" value="${F.date}">
  <label>Catatan (opsional)</label><input id="f-note" value="${esc(F.note)}" maxlength="80">
  <button class="btn" onclick="saveTx()">Simpan</button>`);
}
function saveTx(){
  readTxDom();const a=parseAmt(F.amount);
  if(!a)return toast('Isi jumlah dulu');
  if(!F.date)return toast('Isi tanggal');
  if(F.id){const t=S.tx.find(x=>x.id===F.id);Object.assign(t,{type:F.type,amount:a,category:F.cat,date:F.date,note:F.note.trim()})}
  else S.tx.push({id:uid(),type:F.type,amount:a,category:F.cat,date:F.date,note:F.note.trim(),ts:Date.now()});
  commit('Tersimpan');
}
function openTxDetail(id){
  const t=S.tx.find(x=>x.id===id);if(!t)return;
  const m=txMeta(t),s=SIGN[t.type];
  const editable=t.type==='income'||t.type==='expense';
  sheet(`<h3>${m.icon} ${esc(m.title)}</h3>
  <div class="big ${s>0?'in':'out'}" style="font-size:28px;font-weight:700">${s>0?'+':'-'}${rp(t.amount).replace('-','')}</div>
  <div style="margin-top:10px"><div class="kv"><span>Jenis</span><b>${TL[t.type]}</b></div><div class="kv"><span>Tanggal</span><b>${fmtDate(t.date)}</b></div><div class="kv"><span>Catatan</span><b>${esc(t.note||'-')}</b></div></div>
  ${editable?`<button class="btn sec2" onclick="openTx('${t.id}')">Ubah</button>`:'<p class="muted" style="margin-top:10px">Transaksi ini terhubung ke tabungan/hutang. Hapus saja jika salah catat.</p>'}
  <button class="btn danger" onclick="delTx('${t.id}')">Hapus</button>`);
}
function delTx(id){if(!confirm('Hapus transaksi ini? Saldo akan dihitung ulang.'))return;S.tx=S.tx.filter(t=>t.id!==id);commit('Dihapus')}

/* ====== Sheet jumlah (generik) ====== */
let AM=null;
function openAmount(o){
  AM=o;
  sheet(`<h3>${esc(o.title)}</h3>${o.info?`<p class="muted">${esc(o.info)}</p>`:''}<label>Jumlah (Rp)</label><input id="a-amt" class="big" inputmode="numeric" placeholder="0" value="${o.def?o.def.toLocaleString('id-ID'):''}" oninput="fmtInput(this)"><label>Tanggal</label><input id="a-date" type="date" value="${today()}"><button class="btn" onclick="okAmount()">${esc(o.btn||'Simpan')}</button>`);
  setTimeout(()=>{const e=$('#a-amt');if(e)e.focus()},50);
}
function okAmount(){
  const a=parseAmt($('#a-amt').value),d=$('#a-date').value||today();
  if(!a)return toast('Isi jumlah dulu');
  if(AM.max!=null&&a>AM.max)return toast('Maksimal '+rp(AM.max));
  AM.ok(a,d);
}

/* ====== Tabungan ====== */
function viewTab(c){
  return `<div class="card hero"><div class="lbl">Total tabungan</div><div class="big">${rp(c.saving)}</div><div class="sub"><span>${c.goals.length} target</span></div></div>
  <button class="btn" style="margin:0 0 12px" onclick="openGoal()">+ Target tabungan baru</button>
  ${c.goals.length?c.goals.map(g=>{const p=g.target?Math.min(100,Math.round(g.bal/g.target*100)):0;return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(g.name)}</b><b>${rp(g.bal)}</b></div>
  ${g.target?`<div class="prog"><i style="width:${p}%"></i></div><div class="muted" style="margin:0">${p}% dari ${rp(g.target)}${g.bal>=g.target?' · Tercapai 🎉':''}</div>`:'<div class="muted" style="margin:4px 0 0">Tanpa target</div>'}
  <div class="acts"><button class="sm pri" onclick="goalSave('${g.id}')">Setor</button><button class="sm" onclick="goalWithdraw('${g.id}')">Tarik</button><span style="flex:1"></span><button class="sm del" onclick="delGoal('${g.id}')">Hapus</button></div></div>`}).join(''):'<div class="empty">Belum ada tabungan. Buat target pertamamu.</div>'}
  <p class="muted">Setoran mengurangi saldo kas dan menambah tabungan, jadi total saldo tidak berubah.</p>`;
}
function openGoal(){
  sheet(`<h3>Target tabungan baru</h3><label>Nama</label><input id="g-name" placeholder="mis. Dana darurat" maxlength="40"><label>Target (Rp, opsional)</label><input id="g-target" inputmode="numeric" placeholder="0" oninput="fmtInput(this)"><button class="btn" onclick="saveGoal()">Buat</button>`);
}
function saveGoal(){
  const n=$('#g-name').value.trim();if(!n)return toast('Isi nama dulu');
  S.goals.push({id:uid(),name:n,target:parseAmt($('#g-target').value)});commit('Target dibuat');
}
function goalSave(id){
  const g=S.goals.find(x=>x.id===id);
  openAmount({title:'Setor ke '+g.name,btn:'Setor',ok:(a,d)=>{S.tx.push({id:uid(),type:'save',amount:a,category:'Tabungan',date:d,note:'',goalId:id,ts:Date.now()});commit('Setoran dicatat')}});
}
function goalWithdraw(id){
  const c=calc(),g=c.goals.find(x=>x.id===id);
  if(g.bal<=0)return toast('Saldo tabungan kosong');
  openAmount({title:'Tarik dari '+g.name,info:'Tersedia '+rp(g.bal),max:g.bal,btn:'Tarik',ok:(a,d)=>{S.tx.push({id:uid(),type:'withdraw',amount:a,category:'Tabungan',date:d,note:'',goalId:id,ts:Date.now()});commit('Penarikan dicatat')}});
}
function delGoal(id){
  const g=calc().goals.find(x=>x.id===id);
  if(g.bal>0)return toast('Tarik dulu saldo tabungan ('+rp(g.bal)+') sebelum menghapus');
  if(!confirm('Hapus target "'+g.name+'"?'))return;
  S.goals=S.goals.filter(x=>x.id!==id);S.tx=S.tx.filter(t=>t.goalId!==id);commit('Target dihapus');
}

/* ====== Hutang & Piutang ====== */
function viewHutang(c){
  const act=c.debts.filter(d=>d.rem>0).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
  const done=c.debts.filter(d=>d.rem===0);
  const card=d=>{
    const hut=d.type==='hutang',p=Math.round(d.paid/d.principal*100),over=d.due&&d.rem>0&&d.due<today();
    return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><span class="badge ${hut?'h':'p'}">${hut?'HUTANG':'PIUTANG'}</span> <b>${esc(d.person)}</b></div><b class="${hut?'out':'in'}">${d.rem>0?rp(d.rem):'Lunas ✓'}</b></div>
    <div class="prog ${over?'o':''}"><i style="width:${p}%"></i></div>
    <div class="muted" style="margin:0">${rp(d.paid)} dari ${rp(d.principal)}${d.due?` · Jatuh tempo ${fmtDate(d.due)}${over?' (lewat)':''}`:''}${d.note?' · '+esc(d.note):''}</div>
    <div class="acts">${d.rem>0?`<button class="sm pri" onclick="payDebt('${d.id}')">${hut?'Bayar':'Terima'}</button>`:''}<span style="flex:1"></span><button class="sm del" onclick="delDebt('${d.id}')">Hapus</button></div></div>`;
  };
  return `<div class="grid"><div class="mini"><div class="lbl">Hutang saya</div><div class="val out">${rp(c.hutang)}</div></div><div class="mini"><div class="lbl">Piutang (orang berutang ke saya)</div><div class="val in">${rp(c.piutang)}</div></div></div>
  <button class="btn" style="margin:0 0 12px" onclick="openDebt()">+ Catat hutang / piutang</button>
  ${act.length?act.map(card).join(''):'<div class="empty">Tidak ada hutang/piutang aktif</div>'}
  ${done.length?`<div class="sec"><b>Lunas</b></div>${done.map(card).join('')}`:''}`;
}
let D={};
function readDebtDom(){if($('#d-person')){D.person=$('#d-person').value;D.amount=$('#d-amt').value;D.date=$('#d-date').value||today();D.due=$('#d-due').value;D.note=$('#d-note').value;D.cash=$('#d-cash').checked}}
function openDebt(){D={type:'hutang',person:'',amount:'',date:today(),due:'',note:'',cash:true};renderDebtForm()}
function setDebtType(t){readDebtDom();D.type=t;renderDebtForm()}
function renderDebtForm(){
  const hut=D.type==='hutang';
  sheet(`<h3>Catat hutang / piutang</h3>
  <div class="seg"><button class="${hut?'on out':''}" onclick="setDebtType('hutang')">Hutang saya</button><button class="${!hut?'on in':''}" onclick="setDebtType('piutang')">Piutang</button></div>
  <label>${hut?'Berutang kepada':'Yang berutang'}</label><input id="d-person" value="${esc(D.person)}" maxlength="40" placeholder="Nama">
  <label>Jumlah (Rp)</label><input id="d-amt" class="big" inputmode="numeric" placeholder="0" value="${esc(D.amount)}" oninput="fmtInput(this)">
  <label>Tanggal</label><input id="d-date" type="date" value="${D.date}">
  <label>Jatuh tempo (opsional)</label><input id="d-due" type="date" value="${D.due}">
  <label>Catatan (opsional)</label><input id="d-note" value="${esc(D.note)}" maxlength="80">
  <label class="chk"><input id="d-cash" type="checkbox" ${D.cash?'checked':''}> ${hut?'Uangnya masuk ke saldo kas':'Uangnya keluar dari saldo kas'}</label>
  <p class="muted" style="margin-top:6px">Matikan jika kejadiannya sudah lama dan sudah tercermin di saldo awalmu.</p>
  <button class="btn" onclick="saveDebt()">Simpan</button>`);
}
function saveDebt(){
  readDebtDom();const a=parseAmt(D.amount),p=D.person.trim();
  if(!p)return toast('Isi nama dulu');if(!a)return toast('Isi jumlah dulu');
  const id=uid(),hut=D.type==='hutang';
  S.debts.push({id,type:D.type,person:p,principal:a,due:D.due||'',note:D.note.trim(),date:D.date,ts:Date.now()});
  if(D.cash)S.tx.push({id:uid(),type:hut?'borrow':'lend',amount:a,category:hut?'Pinjaman':'Piutang',date:D.date,note:p,debtId:id,ts:Date.now()});
  commit('Tersimpan');
}
function payDebt(id){
  const d=calc().debts.find(x=>x.id===id),hut=d.type==='hutang';
  openAmount({title:(hut?'Bayar hutang ke ':'Terima dari ')+d.person,info:'Sisa '+rp(d.rem),def:d.rem,max:d.rem,btn:hut?'Bayar':'Terima',ok:(a,dt)=>{S.tx.push({id:uid(),type:hut?'debt_pay':'loan_receive',amount:a,category:hut?'Bayar hutang':'Piutang',date:dt,note:'',debtId:id,ts:Date.now()});commit('Pembayaran dicatat')}});
}
function delDebt(id){
  const d=S.debts.find(x=>x.id===id);
  if(!confirm('Hapus catatan "'+d.person+'"? Semua transaksi terkait ikut terhapus dan saldo kas akan berubah.'))return;
  S.debts=S.debts.filter(x=>x.id!==id);S.tx=S.tx.filter(t=>t.debtId!==id);commit('Dihapus');
}

/* ====== Pengaturan / cadangan ====== */
function openSettings(){
  sheet(`<h3>Pengaturan</h3>
  <p class="muted">Data tersimpan hanya di browser perangkat ini. Menghapus data situs, ganti HP, atau uninstall bisa menghilangkannya. Ekspor cadangan secara rutin.</p>
  <div class="kv"><span>Cadangan terakhir</span><b>${S.lastBackup?fmtDate(S.lastBackup):'Belum pernah'}</b></div>
  <div class="kv"><span>Jumlah transaksi</span><b>${S.tx.length}</b></div>
  <button class="btn" onclick="exportData()">Ekspor cadangan (JSON)</button>
  <button class="btn sec2" onclick="$('#imp').click()">Impor cadangan</button>
  <button class="btn danger" onclick="resetAll()">Hapus semua data</button>`);
}
function exportData(){
  S.lastBackup=today();save();
  const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dompetku-cadangan-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast('Cadangan diunduh');render();
}
$('#imp').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.tx)||!Array.isArray(d.goals)||!Array.isArray(d.debts))throw 0;
      if(!d.tx.every(t=>t&&SIGN[t.type]!==undefined&&Number.isFinite(t.amount)&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)))throw 0;
      if(!confirm('Ganti semua data saat ini dengan cadangan ('+d.tx.length+' transaksi)?'))return;
      S={tx:d.tx,goals:d.goals,debts:d.debts,lastBackup:d.lastBackup||''};commit('Cadangan dipulihkan');
    }catch(x){toast('File cadangan tidak valid')}
  };
  r.readAsText(f);
});
function resetAll(){
  if(!confirm('Hapus SEMUA data? Tidak bisa dibatalkan.'))return;
  if(!confirm('Yakin? Pastikan sudah ekspor cadangan.'))return;
  S={tx:[],goals:[],debts:[],lastBackup:''};commit('Semua data dihapus');
}

/* ====== Init ====== */
render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
